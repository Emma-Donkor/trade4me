# ============================================================================
# TradeSense AI — local data tier (PHASE 01)
# Extended to the full stack in PHASE 34. No application services here yet.
# ============================================================================
name: tradesense

services:
  postgres:
    image: postgres:16
    container_name: tradesense-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradesense
      POSTGRES_PASSWORD: tradesense
      POSTGRES_DB: tradesense
    ports:
      # Host 5433 -> container 5432: native PostgreSQL 18 owns host 5432 locally.
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates tradesense_test on first volume init for the Phase 04+ test suite.
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tradesense -d tradesense']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7
    container_name: tradesense-redis
    restart: unless-stopped
    # AOF gives local durability for cached quotes/queues across restarts.
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      # Host 6380 -> container 6379: native Memurai owns host 6379 locally.
      - '6380:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  pgdata:
  redisdata:
